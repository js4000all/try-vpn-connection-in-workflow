name: Test L2TP/IPsec connection

on:
  workflow_dispatch:

jobs:
  test-vpn:
    runs-on: ubuntu-latest

    steps:
      - name: Install VPN packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            strongswan \
            strongswan-starter \
            xl2tpd \
            ppp \
            iproute2 \
            iputils-ping

      - name: Configure IPsec
        env:
          VPN_SERVER: ${{ secrets.VPN_SERVER }}
          VPN_PSK: ${{ secrets.VPN_PSK }}
        run: |
          set -eu

          sudo tee /etc/ipsec.conf >/dev/null <<EOF
          config setup
              uniqueids=no

          conn sakura-l2tp
              keyexchange=ikev1
              aggressive=yes
              type=transport
              authby=psk

              left=%defaultroute
              leftprotoport=17/1701

              right=${VPN_SERVER}
              rightid=${VPN_SERVER}
              rightprotoport=17/1701

              ike=aes256-sha1-modp1024!
              esp=aes256-sha1!

              auto=add
          EOF

          printf ': PSK "%s"\n' "${VPN_PSK}" |
            sudo tee /etc/ipsec.secrets >/dev/null

          sudo chmod 600 /etc/ipsec.secrets

      - name: Configure strongSwan logging
        run: |
          sudo tee /etc/strongswan.d/charon-logging.conf >/dev/null <<'EOF'
          charon {
              send_vendor_id = no

              filelog {
                  /var/log/charon.log {
                      default = 2
                      ike = 3
                      cfg = 3
                      enc = 2
                      append = no
                      flush_line = yes
                  }
              }
          }
          EOF

      - name: Configure xl2tpd
        env:
          VPN_SERVER: ${{ secrets.VPN_SERVER }}
        run: |
          set -eu

          sudo tee /etc/xl2tpd/xl2tpd.conf >/dev/null <<EOF
          [global]

          [lac sakura]
          lns = ${VPN_SERVER}
          ppp debug = yes
          pppoptfile = /etc/ppp/options.sakura
          length bit = yes
          EOF

      - name: Configure PPP
        env:
          VPN_USERNAME: ${{ secrets.VPN_USERNAME }}
          VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}
        run: |
          set -eu

          sudo tee /etc/ppp/options.sakura >/dev/null <<EOF
          ipcp-accept-local
          ipcp-accept-remote

          refuse-eap
          refuse-pap
          refuse-chap
          refuse-mschap

          noauth

          require-mppe

          mtu 1280
          mru 1280

          name "${VPN_USERNAME}"
          password "${VPN_PASSWORD}"

          debug
          EOF

          sudo chmod 600 /etc/ppp/options.sakura

      - name: Connect IPsec
        run: |
          set -e

          sudo ipsec restart
          sleep 2

          echo "--- IPsec connection ---"
          sudo ipsec up sakura-l2tp

          echo "--- IPsec status ---"
          sudo ipsec statusall

          echo "--- XFRM ESP check ---"
          sudo ip xfrm state | grep -q 'proto esp'

      - name: Start xl2tpd
        run: |
          set -e

          sudo systemctl restart xl2tpd
          sleep 2

          echo "--- xl2tpd status ---"
          sudo systemctl status xl2tpd --no-pager

          echo "--- xl2tpd process ---"
          ps aux | grep '[x]l2tpd'

      - name: Connect L2TP
        run: |
          set -e

          echo "c sakura" |
            sudo tee /var/run/xl2tpd/l2tp-control

          sleep 10

          echo "--- interfaces ---"
          ip addr

          echo "--- routes ---"
          ip route

          echo "--- ppp processes ---"
          ps aux | grep '[p]ppd' || true

          echo "--- ppp0 ---"
          ip addr show ppp0

      - name: Diagnostics
        if: always()
        run: |
          echo "--- IPsec status ---"
          sudo ipsec statusall || true

          echo "--- XFRM state ---"
          sudo ip xfrm state || true

          echo "--- XFRM policy ---"
          sudo ip xfrm policy || true

          echo "--- interfaces ---"
          ip addr || true

          echo "--- routes ---"
          ip route || true

          echo "--- xl2tpd status ---"
          sudo systemctl status xl2tpd --no-pager || true

          echo "--- pppd executable ---"
          ls -l /usr/sbin/pppd || true
          sudo /usr/sbin/pppd --version || true

          echo "--- charon.log ---"
          sudo cat /var/log/charon.log || true

          echo "--- xl2tpd / ppp / IPsec journal ---"
          sudo journalctl \
            --no-pager \
            --since '10 minutes ago' |
            grep -Ei 'xl2tpd|pppd|l2tp|ppp|charon|ipsec' |
            tail -300 \
            || true
