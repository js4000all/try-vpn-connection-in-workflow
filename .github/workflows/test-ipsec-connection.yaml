name: Test L2TP/IPsec connection

on:
  workflow_dispatch:

jobs:
  test-vpn:
    runs-on: ubuntu-latest

    steps:
      - name: Install VPN packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            strongswan \
            strongswan-starter \
            xl2tpd \
            ppp \
            iproute2 \
            iputils-ping

      - name: Configure IPsec
        env:
          VPN_SERVER: ${{ secrets.VPN_SERVER }}
          VPN_PSK: ${{ secrets.VPN_PSK }}
        run: |
          sudo tee /etc/ipsec.conf >/dev/null <<EOF
          config setup
              uniqueids=no

          conn sakura-l2tp
              keyexchange=ikev1
              aggressive=yes
              type=transport
              authby=psk

              left=%defaultroute
              leftprotoport=17/1701

              right=${VPN_SERVER}
              rightid=${VPN_SERVER}
              rightprotoport=17/1701

              ike=aes256-sha1-modp1024!
              esp=aes256-sha1!

              auto=add
          EOF

          printf ': PSK "%s"\n' "${VPN_PSK}" |
            sudo tee /etc/ipsec.secrets >/dev/null

          sudo chmod 600 /etc/ipsec.secrets

      - name: Configure xl2tpd
        env:
          VPN_SERVER: ${{ secrets.VPN_SERVER }}
        run: |
          sudo tee /etc/xl2tpd/xl2tpd.conf >/dev/null <<EOF
          [global]

          [lac sakura]
          lns = ${VPN_SERVER}
          ppp debug = yes
          pppoptfile = /etc/ppp/options.sakura
          length bit = yes
          EOF

      - name: Configure PPP
        env:
          VPN_USERNAME: ${{ secrets.VPN_USERNAME }}
          VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}
        run: |
          sudo tee /etc/ppp/options.sakura >/dev/null <<EOF
          ipcp-accept-local
          ipcp-accept-remote

          refuse-eap
          refuse-pap
          refuse-chap
          refuse-mschap
          require-mschap-v2

          noauth
          noccp

          mtu 1280
          mru 1280

          name "${VPN_USERNAME}"
          password "${VPN_PASSWORD}"

          debug
          EOF

          sudo chmod 600 /etc/ppp/options.sakura

      - name: Connect IPsec
        run: |
          sudo ipsec restart
          sleep 2

          sudo ipsec up sakura-l2tp

          echo "--- IPsec status ---"
          sudo ipsec statusall

      - name: Start xl2tpd
        run: |
          sudo mkdir -p /var/run/xl2tpd

          sudo xl2tpd -D &
          echo $! | sudo tee /var/run/xl2tpd-test.pid

          sleep 2

          echo "--- xl2tpd process ---"
          ps aux | grep '[x]l2tpd'

      - name: Connect L2TP
        run: |
          echo "c sakura" |
            sudo tee /var/run/xl2tpd/l2tp-control

          sleep 10

          echo "--- interfaces ---"
          ip addr

          echo "--- routes ---"
          ip route

          echo "--- ppp processes ---"
          ps aux | grep '[p]ppd' || true

          echo "--- ppp0 ---"
          ip addr show ppp0

      - name: Diagnostics
        if: always()
        run: |
          echo "--- IPsec ---"
          sudo ipsec statusall || true

          echo "--- XFRM state ---"
          sudo ip xfrm state || true

          echo "--- XFRM policy ---"
          sudo ip xfrm policy || true

          echo "--- interfaces ---"
          ip addr || true

          echo "--- routes ---"
          ip route || true

          echo "--- xl2tpd / ppp logs ---"
          sudo journalctl \
            --no-pager \
            --since '10 minutes ago' |
            grep -Ei 'xl2tpd|pppd|l2tp|ppp|charon|ipsec' |
            tail -300 \
            || true
